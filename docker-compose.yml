version: "3.9"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-f1league}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL:       ${DATABASE_URL}
      BOT_NOTIFY_URL:     ${BOT_NOTIFY_URL:-http://bot:8001/internal/race_uploaded}
      BOT_NOTIFY_SECRET:  ${BOT_NOTIFY_SECRET}
      GROQ_API_KEY:       ${GROQ_API_KEY:-}
      FRONTEND_URL:       ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL:        ${BACKEND_URL:-http://localhost:8000}
      AGENT_SECRET_TOKEN: ${AGENT_SECRET_TOKEN:-}
      CORS_ORIGINS:       ${CORS_ORIGINS:-http://localhost:3000}
      SYSTEM_ADMIN_EMAILS: ${SYSTEM_ADMIN_EMAILS:-gregorysky04i@gmail.com}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./shared:/app/shared
      - ./backend:/app/backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    environment:
      NEXT_PUBLIC_API_URL:  ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL:   ${NEXT_PUBLIC_WS_URL}
      NEXTAUTH_SECRET:      ${NEXTAUTH_SECRET:-change-this-nextauth-secret}
      NEXTAUTH_URL:         ${NEXTAUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID:     ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      API_URL:              http://backend:8000
      FRONTEND_URL:         ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL:          ${BACKEND_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      BOT_TOKEN:          ${BOT_TOKEN}
      API_URL:            ${API_URL:-http://backend:8000}
      TG_CHAT_ID:         ${TG_CHAT_ID}
      TG_ADMIN_IDS:       ${TG_ADMIN_IDS}
      BOT_NOTIFY_SECRET:  ${BOT_NOTIFY_SECRET}
      DATABASE_URL:       ${DATABASE_URL}
      F1_SEASON_ID:       ${F1_SEASON_ID:-1}
    # PR 1.3: internal_server.py is only consumed by the backend container
    # via the Docker network (http://bot:8001/internal/*); no need to publish
    # this port to the host. Removed `ports: 8001:8001`.
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    logging: *default-logging

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          TS=$$(date +%Y%m%d-%H%M%S)
          echo "[backup] starting $$TS"
          pg_dump -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Fc \
            > /backups/dump-$$TS.pgc 2>/backups/dump-$$TS.err
          if [ $$? -eq 0 ] && [ -s /backups/dump-$$TS.pgc ]; then
            rm /backups/dump-$$TS.err
            find /backups -name "dump-*.pgc" -mtime +14 -delete
            echo "[backup] success $$TS"
          else
            echo "[backup] FAILED $$TS, see /backups/dump-$$TS.err"
          fi
          sleep 86400
        done
    logging: *default-logging

volumes:
  postgres_data:
