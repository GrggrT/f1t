services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 3s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  backend-test:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INCLUDE_DEV: "true"
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@postgres-test:5432/test
      NEXTAUTH_SECRET: "test-secret-not-for-prod"
      AGENT_SECRET_TOKEN: "test-agent-token"
      POSTGRES_USER: test
      POSTGRES_DB: test
      POSTGRES_PASSWORD: test
      # Used by tests/backend_integration_support.py PostgresConfig.from_repo().
      # Without these the integration tests fall back to 127.0.0.1 (which inside
      # the test container is the container itself, not the host).
      BACKEND_TEST_POSTGRES_HOST: postgres-test
      BACKEND_TEST_POSTGRES_PORT: "5432"
      BACKEND_TEST_POSTGRES_USER: test
      BACKEND_TEST_POSTGRES_PASSWORD: test
    volumes:
      - ./backend:/app/backend:ro
      - ./tests:/app/tests:ro
      - ./agent:/app/agent:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    working_dir: /app
    entrypoint: ["pytest"]
