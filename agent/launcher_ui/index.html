<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лаунчер F1 League</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap');

:root {
  --bg-0: #060608;
  --bg-1: #0f1216;
  --bg-2: #171d24;
  --card: rgba(19, 24, 31, 0.86);
  --card-2: rgba(15, 18, 24, 0.72);
  --line: rgba(255,255,255,0.09);
  --text: #f7f2e7;
  --muted: #9ca7b4;
  --accent: #ff5c39;
  --accent-2: #ffba49;
  --ok: #57d17a;
  --warn: #ffb84d;
  --danger: #ff5e5e;
  --sidebar: 232px;
  --radius: 22px;
  --shadow: 0 28px 80px rgba(0,0,0,0.34);
  --space-1: 8px;
  --space-2: 16px;
  --space-3: 24px;
  --space-4: 32px;
  --shell-pad: 24px;
  --panel-pad: 16px;
  --control-h: 44px;
}

html, body { height: 100%; }
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  height: 100vh;
  overflow: hidden;
  color: var(--text);
  font-family: "Space Grotesk", sans-serif;
  background:
    radial-gradient(circle at top left, rgba(255,92,57,0.16), transparent 26%),
    radial-gradient(circle at 80% 20%, rgba(255,186,73,0.12), transparent 24%),
    linear-gradient(135deg, #040405 0%, #090b0f 38%, #11161d 100%);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,0.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.028) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: linear-gradient(180deg, rgba(255,255,255,0.35), transparent 92%);
}

button, input, select, textarea { font: inherit; }
button { border: 0; background: none; color: inherit; }
input, select {
  width: 100%;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  background: rgba(7, 10, 14, 0.75);
  color: var(--text);
  min-height: var(--control-h);
  padding: 10px 14px;
  outline: none;
  transition: border-color .2s, transform .2s;
}
input:focus, select:focus { border-color: rgba(255,92,57,0.7); transform: translateY(-1px); }
a { color: inherit; text-decoration: none; }

.app {
  display: grid;
  grid-template-columns: var(--sidebar) minmax(0, 1fr);
  height: 100vh;
  min-height: 0;
}
.sidebar {
  min-height: 0;
  overflow-y: auto;
  padding: var(--shell-pad) var(--space-2) var(--space-2);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  border-right: 1px solid rgba(255,255,255,0.06);
  background: linear-gradient(180deg, rgba(8,10,13,0.94), rgba(10,12,16,0.76));
  backdrop-filter: blur(16px);
}
.brand, .user-box {
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--card-2);
  backdrop-filter: blur(16px);
}
.brand { padding: 16px; }
.brand-top { display: flex; align-items: center; gap: 14px; }
.badge-logo {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: linear-gradient(145deg, var(--accent), var(--accent-2));
  color: #18130d;
  display: grid;
  place-items: center;
  font-family: "Rajdhani", sans-serif;
  font-size: 20px;
  font-weight: 700;
}
.brand h1 {
  font-family: "Rajdhani", sans-serif;
  letter-spacing: .06em;
  text-transform: uppercase;
  font-size: 22px;
  line-height: 1;
}
.brand p { margin-top: 8px; color: var(--muted); font-size: 12px; line-height: 1.5; }

.nav { display: flex; flex-direction: column; gap: var(--space-1); }
.nav-item {
  width: 100%;
  min-height: var(--control-h);
  padding: 10px 14px;
  border-radius: 16px;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: background .18s, color .18s, transform .18s;
}
.nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text); transform: translateX(2px); }
.nav-item.active {
  background: linear-gradient(90deg, rgba(255,92,57,0.17), rgba(255,186,73,0.07));
  color: var(--text);
  border: 1px solid rgba(255,92,57,0.18);
}
.nav-item small { color: inherit; opacity: .7; font-size: 11px; }

.sidebar-spacer { flex: 1; }
.user-box { padding: 14px; }
.user-head { display: flex; align-items: center; gap: 12px; }
.avatar {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  font-family: "Rajdhani", sans-serif;
  font-weight: 700;
  font-size: 20px;
  background: linear-gradient(160deg, rgba(255,92,57,0.85), rgba(255,186,73,0.9));
  color: #17120c;
}
.user-meta {
  min-width: 0;
  flex: 1;
}
.user-meta strong {
  display: block;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.user-meta span {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-top: 3px;
  line-height: 1.3;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.user-actions { display: flex; gap: var(--space-1); margin-top: var(--space-2); }

.workspace {
  min-width: 0;
  min-height: 0;
  overflow-y: auto;
  padding: var(--shell-pad);
}
.workspace-dashboard { overflow: hidden; }
.workspace.no-sidebar { padding: 0; }
.page {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  animation: fadeUp .2s ease;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.shell-card, .panel {
  border-radius: var(--radius);
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  backdrop-filter: blur(18px);
}
.panel { padding: var(--panel-pad); }
.hero {
  padding: 24px;
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(320px, .95fr);
  gap: 18px;
}
.hero-main {
  min-height: 220px;
  padding: 28px;
  border-radius: calc(var(--radius) - 4px);
  background:
    linear-gradient(135deg, rgba(255,92,57,0.2), rgba(255,186,73,0.07)),
    linear-gradient(180deg, rgba(18,22,28,0.96), rgba(8,10,14,0.96));
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.eyebrow {
  text-transform: uppercase;
  letter-spacing: .22em;
  color: var(--accent-2);
  font-size: 11px;
  font-weight: 700;
}
.hero h2, .page-title {
  font-family: "Rajdhani", sans-serif;
  font-size: 42px;
  line-height: .96;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.hero p, .lead { color: var(--muted); line-height: 1.65; max-width: 62ch; font-size: 14px; }
.hero-side {
  padding: 22px;
  border-radius: calc(var(--radius) - 4px);
  background:
    linear-gradient(180deg, rgba(9,12,16,0.92), rgba(14,18,24,0.84)),
    url('game_bg.jpg') center/cover no-repeat;
  position: relative;
  overflow: hidden;
}
.hero-side::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(5,7,10,0.1), rgba(5,7,10,0.8));
}
.hero-side > * { position: relative; z-index: 1; }

.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2); }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-2); }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-2); }

.metric {
  min-height: 0;
  padding: var(--panel-pad);
  border-radius: 18px;
  background: linear-gradient(180deg, rgba(22,27,35,0.86), rgba(12,15,20,0.84));
  border: 1px solid rgba(255,255,255,0.06);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: var(--space-1);
}
.metric label {
  display: block;
  text-transform: uppercase;
  letter-spacing: .18em;
  color: var(--muted);
  font-size: 10px;
}
.metric strong {
  display: block;
  font-family: "Rajdhani", sans-serif;
  font-size: 28px;
  letter-spacing: .04em;
  line-height: .92;
}
.metric span { display: block; color: var(--muted); font-size: 12px; line-height: 1.4; }

.panel-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-2);
  margin-bottom: var(--space-2);
}
.panel-head h3 {
  font-family: "Rajdhani", sans-serif;
  font-size: 24px;
  letter-spacing: .05em;
  text-transform: uppercase;
}
.panel-head p { color: var(--muted); font-size: 12px; margin-top: 4px; }

.page-dashboard {
  height: 100%;
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr);
  gap: var(--space-2);
}
.dashboard-top {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1.34fr) minmax(320px, 0.96fr);
  gap: var(--space-2);
  align-items: stretch;
}
.dashboard-card {
  min-height: 0;
  height: 100%;
  padding: var(--panel-pad);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  overflow: hidden;
}
.dashboard-summary {
  background:
    linear-gradient(135deg, rgba(255,92,57,0.18), rgba(255,186,73,0.06)),
    linear-gradient(180deg, rgba(18,22,28,0.96), rgba(8,10,14,0.96));
}
.dashboard-summary-head {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}
.dashboard-title {
  font-family: "Rajdhani", sans-serif;
  font-size: clamp(30px, 2.4vw, 38px);
  line-height: .92;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.dashboard-summary-copy {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.46;
  max-width: 58ch;
}
.dashboard-chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1);
}
.dashboard-headline-card {
  margin-top: auto;
}
.dashboard-headline-card p {
  margin-top: 6px;
  line-height: 1.45;
}
.dashboard-inline-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-2);
}
.dashboard-inline-head strong {
  flex: 1;
}
.dashboard-control {
  position: relative;
  background:
    linear-gradient(180deg, rgba(9,12,16,0.9), rgba(14,18,24,0.86)),
    url('game_bg.jpg') center/cover no-repeat;
}
.dashboard-control::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(5,7,10,0.18), rgba(5,7,10,0.76));
  pointer-events: none;
}
.dashboard-control > * {
  position: relative;
  z-index: 1;
}
.dashboard-mode-row,
.dashboard-action-grid,
.dashboard-metrics,
.dashboard-live-grid {
  display: grid;
  gap: var(--space-1);
}
.dashboard-mode-row {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.dashboard-action-grid {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.dashboard-metrics {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}
.dashboard-action-grid.is-compact {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.dashboard-host-field.is-hidden {
  display: none;
}
.dashboard-host-preview {
  min-height: 0;
  max-height: 168px;
  overflow: auto;
  padding-right: 4px;
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}
.dashboard-mini-catalog {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}
.dashboard-mini-catalog .stack {
  gap: var(--space-1);
}
.dashboard-mini-catalog .list-card,
.dashboard-mini-catalog .empty {
  padding: 12px 14px;
  border-radius: 16px;
}
.dashboard-note {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.4;
}
.dashboard-note.is-danger {
  color: var(--danger);
}
.dashboard-metric {
  min-height: 108px;
}
.dashboard-bottom {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(280px, 0.9fr);
  gap: var(--space-2);
}
.dashboard-column {
  min-height: 0;
  display: grid;
  grid-template-rows: repeat(2, minmax(0, 1fr));
  gap: var(--space-2);
}
.dashboard-panel {
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.dashboard-panel-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-2);
  min-height: 56px;
}
.dashboard-panel-head p {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.4;
  margin-top: 4px;
}
.dashboard-panel-body {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding-right: 4px;
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}
.dashboard-panel-actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1);
}
.dashboard-panel-actions .btn {
  flex: 1 1 148px;
}
.dashboard-live-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.dashboard-live-grid .list-card {
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.dashboard-status-note {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.4;
}
.clamp-1, .clamp-2, .clamp-3 {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.clamp-1 { -webkit-line-clamp: 1; }
.clamp-2 { -webkit-line-clamp: 2; }
.clamp-3 { -webkit-line-clamp: 3; }

.stack { display: flex; flex-direction: column; gap: var(--space-1); }
.row { display: flex; gap: var(--space-1); flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 7px; flex: 1; min-width: 180px; }
.field label {
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .16em;
}

.pill, .tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border-radius: 999px;
  padding: 8px 12px;
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.pill { border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); }
.pill.online { color: var(--ok); border-color: rgba(87,209,122,0.3); background: rgba(87,209,122,0.08); }
.pill.warn { color: var(--warn); border-color: rgba(255,184,77,0.25); background: rgba(255,184,77,0.08); }
.pill.info { color: #9dc7ff; border-color: rgba(104,154,255,0.24); background: rgba(104,154,255,0.08); }
.pill.offline, .pill.error { color: var(--danger); border-color: rgba(255,94,94,0.24); background: rgba(255,94,94,0.08); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: var(--control-h);
  padding: 10px 16px;
  border-radius: 16px;
  cursor: pointer;
  transition: transform .18s, filter .18s, border-color .18s, background .18s;
  font-weight: 600;
}
.btn:hover { transform: translateY(-1px); filter: brightness(1.04); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.btn-primary {
  color: #18120d;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
}
.btn-secondary {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
}
.btn-ghost {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.08);
}
.btn-danger {
  background: rgba(255,94,94,0.12);
  border: 1px solid rgba(255,94,94,0.22);
  color: #ff9898;
}
.btn-wide { width: 100%; }

.status-line, .diag-row, .list-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 12px 0;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.status-line:last-child, .diag-row:last-child, .list-item:last-child { border-bottom: 0; }
.subtle { color: var(--muted); font-size: 12px; line-height: 1.6; }
.mono { font-family: Consolas, "SFMono-Regular", monospace; }

.list-card {
  border-radius: 18px;
  padding: 14px 16px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
}
.list-card strong { font-size: 14px; }
.list-card p { color: var(--muted); font-size: 12px; margin-top: 4px; line-height: 1.45; }
.issue-card {
  border-radius: 18px;
  padding: 14px 16px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.03);
}
.issue-card.warn {
  border-color: rgba(255,184,77,0.2);
  background: linear-gradient(135deg, rgba(255,184,77,0.12), rgba(255,255,255,0.03));
}
.issue-card.error {
  border-color: rgba(255,94,94,0.22);
  background: linear-gradient(135deg, rgba(255,94,94,0.12), rgba(255,255,255,0.03));
}
.issue-card.ok {
  border-color: rgba(87,209,122,0.18);
  background: linear-gradient(135deg, rgba(87,209,122,0.1), rgba(255,255,255,0.03));
}
.issue-card strong { display: block; font-size: 14px; }
.issue-card p { margin-top: 8px; color: var(--muted); font-size: 12px; line-height: 1.45; }
.event-feed { display: flex; flex-direction: column; gap: 12px; }
.event-item {
  border-radius: 18px;
  padding: 12px 14px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
}
.event-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.event-copy { color: var(--muted); font-size: 12px; line-height: 1.45; }
.event-copy strong { color: var(--text); font-size: 13px; }
.event-copy div {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
}

.login-shell {
  min-height: 100vh;
  padding: clamp(18px, 2vw, 28px);
  display: grid;
  place-items: center;
  background: linear-gradient(180deg, rgba(7,10,13,0.98), rgba(10,13,16,0.98));
}
.login-layout {
  width: min(1160px, 100%);
  min-height: min(720px, calc(100vh - 40px));
  display: grid;
  grid-template-columns: minmax(0, 1.04fr) minmax(390px, .96fr);
  border-radius: 24px;
  overflow: hidden;
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  background: rgba(11,15,19,0.98);
  backdrop-filter: none;
}
.login-hero {
  padding: 32px;
  display: grid;
  align-content: start;
  gap: 12px;
  background: linear-gradient(180deg, rgba(15,20,25,0.98), rgba(17,22,27,0.98));
}
.login-hero::after {
  display: none;
}
.login-panel {
  padding: 28px;
  display: grid;
  align-content: start;
  gap: 16px;
  border-left: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(12,16,20,0.98), rgba(15,20,25,0.98));
}

.kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .22em; color: var(--accent-2); }
.title-xl {
  font-family: "Rajdhani", sans-serif;
  font-size: clamp(44px, 4vw, 58px);
  letter-spacing: .04em;
  text-transform: uppercase;
  line-height: .88;
  margin: 0;
}
.login-status-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 8px;
}
.login-status-card {
  display: grid;
  gap: 4px;
  padding: 13px 14px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: #131920;
}
.login-status-card strong {
  display: block;
  font-family: "Rajdhani", sans-serif;
  font-size: 24px;
  line-height: .92;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.login-status-card p {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.4;
}
.login-status-card[data-tone="online"] {
  border-color: rgba(88,181,111,0.18);
  box-shadow: inset 0 1px 0 rgba(88,181,111,0.08);
}
.login-status-card[data-tone="warn"] {
  border-color: rgba(201,138,46,0.2);
  box-shadow: inset 0 1px 0 rgba(201,138,46,0.08);
}
.login-status-card[data-tone="offline"] {
  border-color: rgba(212,93,79,0.2);
  box-shadow: inset 0 1px 0 rgba(212,93,79,0.08);
}
.key-points {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin-top: 4px;
}
.key-point {
  padding: 13px 14px;
  border-radius: 14px;
  background: #131920;
  border: 1px solid var(--line);
}
.key-point strong {
  display: block;
  font-size: 13px;
  margin-bottom: 5px;
}
.key-point span {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.45;
}

.empty {
  padding: 18px;
  border-radius: 18px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.025);
}

.chat-log { display: flex; flex-direction: column; gap: 12px; min-height: 400px; }
.bubble-row { display: flex; gap: 12px; align-items: flex-start; }
.bubble-row.user { flex-direction: row-reverse; }
.bubble {
  max-width: min(760px, 72%);
  padding: 14px 16px;
  border-radius: 18px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  line-height: 1.65;
  font-size: 13px;
}
.bubble.user {
  background: linear-gradient(135deg, rgba(255,92,57,0.14), rgba(255,186,73,0.08));
  border-color: rgba(255,92,57,0.18);
}
.quick-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.chip {
  padding: 9px 12px;
  border-radius: 999px;
  cursor: pointer;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--muted);
  font-size: 12px;
}

.hud-preview {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 22px;
  border: 1px solid rgba(255,255,255,0.08);
  background:
    radial-gradient(circle at 16% 12%, rgba(255,92,57,0.2), transparent 26%),
    radial-gradient(circle at 82% 18%, rgba(255,186,73,0.16), transparent 22%),
    linear-gradient(180deg, rgba(10,13,17,0.26), rgba(7,10,13,0.9)),
    url('game_bg.jpg') center/cover no-repeat;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
}
.hud-preview::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 48px 48px;
  opacity: 0.32;
}
.hud-preview::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at bottom center, rgba(255,255,255,0.08), transparent 60%),
    linear-gradient(180deg, rgba(255,255,255,0.04), transparent 22%),
    linear-gradient(180deg, rgba(4,6,9,0.08), rgba(4,6,9,0.46));
}
.hud-preview-stage {
  position: absolute;
  inset: 0;
  opacity: var(--preview-opacity, 0.85);
  transition: opacity .18s ease;
}
.hud-preview-note {
  position: absolute;
  left: 18px;
  right: 18px;
  bottom: 14px;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: rgba(247,242,231,0.7);
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.hud-widget {
  position: absolute;
  padding: 10px;
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,0.1);
  background:
    linear-gradient(180deg, rgba(18,22,28,0.92), rgba(7,10,13,0.82)),
    rgba(7,10,13,0.62);
  color: var(--text);
  cursor: grab;
  user-select: none;
  overflow: hidden;
  backdrop-filter: blur(16px);
  box-shadow: 0 16px 30px rgba(0,0,0,0.2);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, opacity .18s ease, filter .18s ease;
}
.hud-widget::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent 24%);
}
.hud-widget * { pointer-events: none; }
.hud-widget.active {
  border-color: rgba(255,92,57,0.45);
  box-shadow: 0 0 0 1px rgba(255,92,57,0.16), 0 22px 34px rgba(0,0,0,0.24);
}
.hud-widget.inactive {
  opacity: 0.24;
  filter: grayscale(0.85) saturate(0.55);
}
.hud-widget.dragging {
  cursor: grabbing;
  transform: scale(1.01);
  box-shadow: 0 0 0 1px rgba(255,186,73,0.45), 0 26px 42px rgba(0,0,0,0.32);
}
.hud-key,
.hud-state {
  position: absolute;
  top: 10px;
  z-index: 1;
  padding: 4px 8px;
  border-radius: 999px;
  font-family: "Rajdhani", sans-serif;
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
}
.hud-key {
  left: 10px;
  background: rgba(255,255,255,0.06);
  color: rgba(247,242,231,0.76);
}
.hud-state {
  right: 10px;
  background: rgba(87,209,122,0.14);
  color: #93f2af;
}
.hud-widget.inactive .hud-state {
  background: rgba(255,255,255,0.08);
  color: rgba(247,242,231,0.58);
}
.hud-card {
  position: relative;
  z-index: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  justify-content: flex-start;
}
.pv-head,
.pv-meta-row,
.pv-stat-row,
.pv-chip-row,
.pv-speed-main,
.pv-pedal-bars,
.pv-tyre-grid {
  display: flex;
  align-items: center;
}
.pv-head,
.pv-meta-row,
.pv-stat-row,
.pv-chip-row {
  justify-content: space-between;
  gap: 8px;
}
.pv-head {
  font-family: "Rajdhani", sans-serif;
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
}
.pv-kicker,
.pv-copy {
  color: rgba(247,242,231,0.7);
}
.pv-kicker {
  font-family: "Rajdhani", sans-serif;
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
}
.pv-copy {
  font-size: 11px;
  line-height: 1.4;
}
.pv-main,
.pv-speed-value,
.pv-delta-value {
  font-family: "Rajdhani", sans-serif;
  line-height: .92;
  text-transform: uppercase;
}
.pv-main { font-size: 30px; }
.pv-delta-value { font-size: 34px; }
.pv-delta-value.good { color: #7be495; }
.pv-delta-value.bad { color: #ff8b7a; }
.pv-pill,
.pv-status {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  padding: 4px 8px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.05);
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.pv-status {
  background: rgba(255,92,57,0.16);
  border-color: rgba(255,92,57,0.2);
  color: #ffd1c7;
}
.pv-timing-rows {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 20px;
}
.pv-timing-row {
  display: grid;
  grid-template-columns: 18px 1fr auto auto;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: 12px;
  background: rgba(255,255,255,0.04);
  font-size: 11px;
}
.pv-timing-row.self {
  background: linear-gradient(90deg, rgba(255,92,57,0.18), rgba(255,255,255,0.04));
  border: 1px solid rgba(255,92,57,0.14);
}
.pv-pos {
  font-family: "Rajdhani", sans-serif;
  font-size: 16px;
  font-weight: 700;
}
.pv-name {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pv-gap {
  color: rgba(247,242,231,0.68);
  font-size: 10px;
}
.pv-tyre {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: "Rajdhani", sans-serif;
  font-size: 11px;
  font-weight: 700;
}
.pv-tyre.soft { background: #ff5e5e; color: #1a0d0d; }
.pv-tyre.medium { background: #ffcf54; color: #231b05; }
.pv-tyre.hard { background: #e7ebf0; color: #121821; }
.pv-session .pv-main { margin-top: 20px; }
.pv-session .pv-meta-row {
  flex-wrap: wrap;
  margin-top: auto;
}
.pv-speed-main {
  gap: 10px;
  align-items: flex-end;
  margin-top: auto;
}
.pv-speed-value { font-size: 56px; }
.pv-speed-unit {
  font-family: "Rajdhani", sans-serif;
  font-size: 14px;
  letter-spacing: .18em;
  color: rgba(247,242,231,0.68);
}
.pv-pedals { justify-content: space-between; }
.pv-pedal-bars {
  justify-content: space-between;
  align-items: flex-end;
  gap: 14px;
  flex: 1;
  margin-top: 18px;
}
.pv-pedal-column {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  flex: 1;
}
.pv-pedal-column span {
  font-family: "Rajdhani", sans-serif;
  font-size: 10px;
  letter-spacing: .14em;
  color: rgba(247,242,231,0.66);
}
.pv-pedal-track {
  width: 100%;
  height: 74px;
  padding: 4px;
  display: flex;
  align-items: flex-end;
  border-radius: 999px;
  background: rgba(255,255,255,0.06);
}
.pv-pedal-fill {
  width: 100%;
  border-radius: 999px;
}
.pv-pedal-fill.throttle { background: linear-gradient(180deg, #8df6a8, #2ea74d); }
.pv-pedal-fill.brake { background: linear-gradient(180deg, #ffb7a8, #d93b3b); }
.pv-tyres .pv-head { margin-bottom: 14px; }
.pv-tyre-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: auto;
}
.pv-tyre-cell {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 10px 8px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.06);
  background: rgba(255,255,255,0.04);
  text-align: center;
}
.pv-tyre-cell span,
.pv-tyre-cell small {
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: rgba(247,242,231,0.66);
}
.pv-tyre-cell strong {
  font-family: "Rajdhani", sans-serif;
  font-size: 22px;
}
.pv-tyre-cell.cool strong { color: #7de1ff; }
.pv-tyre-cell.warm strong { color: #7be495; }
.pv-tyre-cell.hot strong { color: #ff9d7b; }
.pv-progress {
  width: 100%;
  height: 10px;
  border-radius: 999px;
  overflow: hidden;
  background: rgba(255,255,255,0.08);
}
.pv-progress-fill {
  height: 100%;
  border-radius: 999px;
}
.pv-progress-fill.ers {
  background: linear-gradient(90deg, #ffba49, #ff5c39);
}
.pv-progress-fill.fuel {
  background: linear-gradient(90deg, #6fa8ff, #3d69d8);
}
.pv-engineer-title { font-size: 22px; margin-top: 18px; }
.pv-engineer-copy {
  margin-top: auto;
  color: rgba(247,242,231,0.76);
  font-size: 12px;
  line-height: 1.5;
}
.pv-chip-row {
  flex-wrap: wrap;
  justify-content: flex-start;
  gap: 8px;
}

.toast-stack {
  position: fixed;
  right: 20px;
  bottom: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 50;
}
.toast {
  min-width: 280px;
  padding: 14px 16px;
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(11,14,18,0.9);
  backdrop-filter: blur(16px);
  box-shadow: var(--shadow);
  font-size: 13px;
}
.toast.success { border-color: rgba(87,209,122,0.28); }
.toast.error { border-color: rgba(255,94,94,0.28); }
.toast.info { border-color: rgba(255,186,73,0.24); }

.modal-wrap {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display: grid;
  place-items: center;
  z-index: 40;
  backdrop-filter: blur(10px);
}
.modal {
  width: min(460px, calc(100vw - 32px));
  padding: 24px;
  border-radius: 24px;
  background: rgba(11,14,18,0.96);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: var(--shadow);
}
.spinner {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.12);
  border-top-color: var(--accent);
  animation: spin .8s linear infinite;
  margin: 32px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

.sidebar::-webkit-scrollbar,
.workspace::-webkit-scrollbar,
.dashboard-host-preview::-webkit-scrollbar,
.dashboard-panel-body::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
.sidebar::-webkit-scrollbar-thumb,
.workspace::-webkit-scrollbar-thumb,
.dashboard-host-preview::-webkit-scrollbar-thumb,
.dashboard-panel-body::-webkit-scrollbar-thumb {
  border-radius: 999px;
  background: rgba(255,255,255,0.12);
}
.sidebar::-webkit-scrollbar-track,
.workspace::-webkit-scrollbar-track,
.dashboard-host-preview::-webkit-scrollbar-track,
.dashboard-panel-body::-webkit-scrollbar-track {
  background: transparent;
}

@media (max-height: 920px) {
  :root {
    --sidebar: 220px;
    --space-2: 12px;
    --space-3: 16px;
    --shell-pad: 16px;
    --panel-pad: 14px;
    --control-h: 40px;
  }

  .dashboard-title { font-size: clamp(26px, 2vw, 32px); }
  .dashboard-summary-copy,
  .dashboard-note,
  .dashboard-status-note,
  .dashboard-panel-head p { line-height: 1.35; }
  .dashboard-host-preview { max-height: 132px; }
  .dashboard-metric { min-height: 92px; }
  .dashboard-panel-head { min-height: 48px; }
  .dashboard-bottom { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(240px, 0.84fr); }
}

@media (max-height: 820px) {
  :root {
    --sidebar: 208px;
    --space-2: 8px;
    --space-3: 10px;
    --shell-pad: 10px;
    --panel-pad: 10px;
    --control-h: 36px;
  }

  .dashboard-title { font-size: 26px; }
  .dashboard-summary-copy { -webkit-line-clamp: 2; }
  .dashboard-host-preview { max-height: 96px; }
  .dashboard-metric { min-height: 78px; }
  .dashboard-panel-head { min-height: 42px; }
  .metric strong { font-size: 22px; }
  .dashboard-panel-head p,
  .dashboard-note,
  .dashboard-status-note,
  .subtle { font-size: 11px; }
}

@media (max-width: 1180px) {
  .hero, .grid-4, .grid-3, .grid-2, .login-layout { grid-template-columns: 1fr; }
  .sidebar { width: 208px; }
  .dashboard-top,
  .dashboard-metrics,
  .dashboard-bottom { grid-template-columns: 1fr; }
  .dashboard-column { grid-template-rows: repeat(2, minmax(220px, auto)); }
  .workspace-dashboard { overflow-y: auto; }
  .page-dashboard { height: auto; grid-template-rows: auto; }
}

:root {
  --bg-0: #0a0d10;
  --bg-1: #11161b;
  --bg-2: #151c22;
  --bg-3: #1b232b;
  --card: rgba(17, 22, 27, 0.98);
  --card-2: rgba(21, 28, 34, 0.98);
  --line: rgba(166, 178, 191, 0.11);
  --line-strong: rgba(166, 178, 191, 0.16);
  --text: #f2f5f7;
  --muted: #9ba8b4;
  --muted-2: #6d7884;
  --accent: #d94332;
  --accent-2: #c98a2e;
  --ok: #58b56f;
  --warn: #c98a2e;
  --danger: #d45d4f;
  --info: #7098d6;
  --sidebar: 236px;
  --radius: 16px;
  --radius-lg: 20px;
  --radius-sm: 12px;
  --space-0: 4px;
  --space-1: 8px;
  --space-2: 12px;
  --space-3: 16px;
  --space-4: 20px;
  --space-5: 24px;
  --space-6: 32px;
  --shell-pad: 22px;
  --panel-pad: 20px;
  --control-h: 40px;
  --control-h-primary: 44px;
  --shadow: 0 12px 32px rgba(0,0,0,0.18);
}

body {
  color: var(--text);
  font-family: "Inter", system-ui, sans-serif;
  background:
    radial-gradient(circle at top right, rgba(217,67,50,0.05), transparent 22%),
    radial-gradient(circle at 80% 4%, rgba(201,138,46,0.035), transparent 18%),
    linear-gradient(180deg, #090c0f 0%, #0a0d10 36%, #0d1115 100%);
}

body::before {
  background-image:
    linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
  background-size: 72px 72px;
  mask-image: linear-gradient(180deg, rgba(255,255,255,0.12), transparent 76%);
}

input,
select {
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: #0e1318;
  min-height: var(--control-h);
  padding: 0 14px;
  color: var(--text);
}

input:focus,
select:focus {
  border-color: rgba(217,67,50,0.58);
  transform: none;
  box-shadow: 0 0 0 1px rgba(217,67,50,0.14);
}

.app {
  grid-template-columns: var(--sidebar) minmax(0, 1fr);
}

.sidebar {
  padding: var(--shell-pad) var(--space-2) var(--space-2);
  gap: 14px;
  border-right: 1px solid rgba(255,255,255,0.05);
  background: linear-gradient(180deg, rgba(9,12,15,0.98), rgba(10,14,18,0.96));
  backdrop-filter: none;
}

.brand,
.user-box {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--card);
  backdrop-filter: none;
  box-shadow: none;
}

.brand {
  padding: 16px;
}

.brand-top {
  align-items: flex-start;
  gap: 12px;
}

.badge-logo {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: linear-gradient(180deg, var(--accent), #b53b2c);
  color: #f9efeb;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
}

.brand h1 {
  margin: 0;
  font-size: 20px;
  line-height: 1.02;
  letter-spacing: .08em;
}

.brand p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.nav {
  gap: 4px;
}

.nav-item {
  min-height: 54px;
  padding: 9px 12px;
  border-radius: 13px;
  border: 1px solid transparent;
  color: var(--muted);
  align-items: center;
  gap: 10px;
  transition: background .18s, color .18s, border-color .18s;
}

.nav-item:hover {
  background: rgba(255,255,255,0.035);
  color: var(--text);
  transform: none;
}

.nav-item.active {
  background: linear-gradient(90deg, rgba(217,67,50,0.56) 0 3px, rgba(255,255,255,0.032) 3px 100%);
  color: var(--text);
  border-color: rgba(255,255,255,0.08);
}

.nav-copy {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.nav-title {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .01em;
}

.nav-item small {
  font-size: 11px;
  line-height: 1.35;
  opacity: 1;
  color: var(--muted);
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.nav-item.active small {
  color: #b4c0ca;
}

.nav-state {
  min-width: 14px;
  color: rgba(255,255,255,0.14);
  font-size: 12px;
  line-height: 1.2;
  text-align: right;
}

.nav-item.active .nav-state {
  color: rgba(217,67,50,0.88);
}

.sidebar-tools {
  display: grid;
  gap: 8px;
}

.utility-btn {
  min-height: 36px;
  padding: 0 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.018);
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  transition: border-color .18s, color .18s, background .18s;
}

.utility-btn:hover {
  border-color: var(--line-strong);
  color: var(--text);
  background: rgba(255,255,255,0.04);
}

<script>
const WIDGETS = [
  { key: "timing", label: "Башня тайминга", icon: "TT", x: 2, y: 8, w: 20, h: 50 },
  { key: "session", label: "Сессия", icon: "SC", x: 36, y: 6, w: 28, h: 12 },

  { key: "speed", label: "Скорость", icon: "SPD", x: 51, y: 69, w: 15, h: 19 },
  { key: "pedals", label: "Педали", icon: "PDL", x: 67, y: 68, w: 11, h: 20 },
  { key: "tyres", label: "Шины", icon: "TYR", x: 80, y: 10, w: 18, h: 25 },

const QUICK_PROMPTS = [
  "Где я теряю время?",

  "Подскажи по ERS",
  "Точки торможения на этот круг",
  "Какая стратегия нужна сейчас?",
];

const PROFILE_METRICS = [
  { key: "races", label: "Гонки", note: "официальные старты" },
  { key: "wins", label: "Победы", note: "победы за карьеру" },
  { key: "podiums", label: "Подиумы", note: "финиши в топ-3" },
  { key: "best_finish", label: "Лучший финиш", note: "пиковый результат" },
];

const HUD_PREVIEW_MARKUP = {
  timing: `
    <div class="hud-card pv-timing">
      <div class="pv-head"><span>Пульт гонки</span><span>Круг 18/29</span></div>
      <div class="pv-timing-rows">
        <div class="pv-timing-row"><span class="pv-pos">1</span><span class="pv-name">VER</span><span class="pv-gap">Лидер</span><span class="pv-tyre soft">S</span></div>
        <div class="pv-timing-row self"><span class="pv-pos">2</span><span class="pv-name">ВЫ</span><span class="pv-gap">+1.842</span><span class="pv-tyre medium">M</span></div>
        <div class="pv-timing-row"><span class="pv-pos">3</span><span class="pv-name">NOR</span><span class="pv-gap">+2.104</span><span class="pv-tyre hard">H</span></div>
      </div>

  `,
  session: `

      <strong class="pv-main">Silverstone</strong>
      <div class="pv-meta-row">
        <span class="pv-pill">Круг 18/29</span>
        <span class="pv-pill">Лёгкая облачность</span>
        <span class="pv-pill">Воздух 24C</span>

  `,
  delta: `
    <div class="hud-card pv-delta">

  `,
  speed: `

      <div class="pv-meta-row"><span class="pv-kicker">Болид 01</span><span class="pv-status">DRS</span></div>
      <div class="pv-speed-main"><strong class="pv-speed-value">287</strong><span class="pv-speed-unit">KM/H</span></div>
      <span class="pv-copy">Передача 7 · разгон на выходе</span>
    </div>
  `,
  pedals: `
    <div class="hud-card pv-pedals">
      <span class="pv-kicker">Педали</span>
      <div class="pv-pedal-bars">
        <div class="pv-pedal-column">
          <div class="pv-pedal-track"><div class="pv-pedal-fill throttle" style="height:82%"></div></div>
          <span>THR</span>
        </div>
        <div class="pv-pedal-column">
          <div class="pv-pedal-track"><div class="pv-pedal-fill brake" style="height:46%"></div></div>
          <span>BRK</span>
        </div>
      </div>
    </div>
  `,
  tyres: `
    <div class="hud-card pv-tyres">
      <div class="pv-head"><span>Окно шин</span><span>Медиум</span></div>
      <div class="pv-tyre-grid">
        <div class="pv-tyre-cell warm"><span>FL</span><strong>27%</strong><small>98C</small></div>
        <div class="pv-tyre-cell warm"><span>FR</span><strong>29%</strong><small>99C</small></div>
        <div class="pv-tyre-cell cool"><span>RL</span><strong>24%</strong><small>92C</small></div>
        <div class="pv-tyre-cell hot"><span>RR</span><strong>31%</strong><small>101C</small></div>
      </div>
    </div>
  `,
  ers: `
    <div class="hud-card pv-ers">
      <div class="pv-head"><span>Энергия</span><span>+3.8 круга</span></div>
      <div class="pv-stat-row"><span class="pv-copy">Заряд ERS</span><strong>62%</strong></div>
      <div class="pv-progress"><div class="pv-progress-fill ers" style="width:62%"></div></div>
      <div class="pv-stat-row"><span class="pv-copy">Топливное окно</span><strong>Стабильно</strong></div>
      <div class="pv-progress"><div class="pv-progress-fill fuel" style="width:54%"></div></div>
    </div>
  `,
  engineer: `
    <div class="hud-card pv-engineer">
      <div class="pv-head"><span>ИИ-инженер</span><span>Онлайн</span></div>
      <strong class="pv-main pv-engineer-title">Радиорубка</strong>
      <p class="pv-engineer-copy">Следи за температурой переднего левого колеса в третьем секторе. Сохрани ERS к выходу на Hangar.</p>
      <div class="pv-chip-row">
        <span class="pv-pill">Шины</span>
        <span class="pv-pill">ERS</span>
        <span class="pv-pill">Стратегия</span>
      </div>
    </div>
  `,
};

function defaultWidgetPositions() {
  return WIDGETS.map(widget => ({ x: widget.x, y: widget.y }));
}

function normalizeWidgetFlags(flags) {
  return WIDGETS.map((_, index) => Array.isArray(flags) ? flags[index] !== false : true);
}

function normalizeWidgetPositions(positions) {
  return WIDGETS.map((widget, index) => {
    const pos = positions?.[index];
    const rawX = Number(pos?.x);
    const rawY = Number(pos?.y);
    return {
      x: Number.isFinite(rawX) ? Math.max(0, Math.min(100, rawX)) : widget.x,
      y: Number.isFinite(rawY) ? Math.max(0, Math.min(100, rawY)) : widget.y,
    };
  });
}

function renderHudPreviewWidget(widget, index, enabled, position) {
  return `
    <div class="hud-widget ${enabled ? "active" : "inactive"}" data-index="${index}" data-key="${widget.key}"
         style="left:${position.x}%;top:${position.y}%;width:${widget.w}%;height:${widget.h}%"
         ondblclick="toggleWidget(${index})" onmousedown="startDragWidget(event,${index})">
      <span class="hud-key">${esc(widget.icon)}</span>
      <span class="hud-state">${enabled ? "Вкл" : "Выкл"}</span>
      ${HUD_PREVIEW_MARKUP[widget.key] || `<div class="hud-card"><strong>${esc(widget.label)}</strong></div>`}
    </div>
  `;
}

function collectOverlayDraft() {
  const serverInput = document.getElementById("cfg-server-url");
  const frontendInput = document.getElementById("cfg-frontend-url");
  const wsInput = document.getElementById("cfg-ws-url");
  const udpInput = document.getElementById("cfg-udp-port");
  const overlaySelect = document.getElementById("cfg-overlay-enabled");
  const opacityInput = document.getElementById("cfg-opacity");
  const widgetNodes = Array.from(document.querySelectorAll(".hud-widget"));
  const positions = widgetNodes.length
    ? widgetNodes.map((node, index) => {
        const fallback = WIDGETS[index];
        const left = Number.parseFloat(node.style.left);
        const top = Number.parseFloat(node.style.top);
        return {
          x: Number.isFinite(left) ? Math.round(left * 10) / 10 : fallback.x,
          y: Number.isFinite(top) ? Math.round(top * 10) / 10 : fallback.y,
        };
      })
    : normalizeWidgetPositions(state.widgetPositions || state.config?.widget_positions);

  return {
    server_url: serverInput ? serverInput.value.trim() : (state.config?.server_url || "http://localhost:8000"),
    frontend_url: frontendInput ? frontendInput.value.trim() : (state.config?.frontend_url || "http://localhost:3000"),
    ws_url: wsInput ? wsInput.value.trim() : (state.config?.ws_url || "ws://localhost:8000/ws/agent"),
    udp_port: udpInput ? udpInput.value.trim() : (state.config?.udp_port || "20777"),
    overlay_enabled: overlaySelect ? overlaySelect.value === "1" : Boolean(state.config?.overlay_enabled),
    overlay_opacity: Number(opacityInput ? opacityInput.value : (state.config?.overlay_opacity || 85)),
    widgets: widgetNodes.length ? widgetNodes.map(node => node.classList.contains("active")) : normalizeWidgetFlags(state.config?.widgets),
    widget_positions: positions,
  };
}

const state = {
  page: "login",
  params: {},
  user: window.__launcherBootUser || null,
  config: null,
  agentStatus: null,
  live: null,
  diagnostics: null,
  sessions: [],
  lobbies: [],
  lobbiesError: "",
  hostSeasons: [],
  hostSeasonsLoading: false,
  hostSeasonsError: "",
  hostSeasonsLoadedAt: 0,
  profile: null,
  profileError: "",
  engineerMessages: [],
  selectedMode: "personal",
  selectedSeason: "",
  pollingId: null,
  suppressNextStateToast: null,
  suppressErrorStateToastUntil: 0,
  widgetPositions: null,
};

function esc(value) {
  const el = document.createElement("div");
  el.textContent = value == null ? "" : String(value);
  return el.innerHTML;
}

function escAttr(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

async function api(method, ...args) {
  if (!window.pywebview || !window.pywebview.api || !window.pywebview.api[method]) {
    throw new Error("API лаунчера ещё не готов");
  }
  return window.pywebview.api[method](...args);
}

function unwrap(result, fallback = "Операция не выполнена") {
  if (!result) throw new Error(fallback);
  if (result.error) throw new Error(result.error);
  if (result.ok === false) throw new Error(result.error || fallback);
  return result;
}

function toast(message, type = "info") {
  const node = document.createElement("div");
  node.className = `toast ${type}`;
  node.textContent = message;
  document.getElementById("toasts").appendChild(node);
  setTimeout(() => node.remove(), 4200);
}

function setModal(html = "") {
  document.getElementById("modal-root").innerHTML = html;
}

function initials(name) {
  return (name || "?").trim().slice(0, 1).toUpperCase() || "?";
}

function statusTone(flag, warn = false) {
  if (warn) return "warn";
  return flag ? "online" : "offline";
}

function statusPill(ok, text, warn = false) {
  return `<span class="pill ${statusTone(ok, warn)}">${esc(text)}</span>`;
}

function pillByTone(tone, text) {
  return `<span class="pill ${tone}">${esc(text)}</span>`;
}

function renderButton({ label, variant = "secondary", onclick = "", disabled = false, className = "", title = "", id = "" } = {}) {
  const classes = ["btn", `btn-${variant}`, className].filter(Boolean).join(" ");
  const onclickAttr = onclick ? `onclick="${onclick}"` : "";
  const disabledAttr = disabled ? "disabled" : "";
  const titleAttr = title ? `title="${esc(title)}"` : "";
  const idAttr = id ? `id="${esc(id)}"` : "";
  return `<button class="${classes}" ${idAttr} ${onclickAttr} ${disabledAttr} ${titleAttr}>${esc(label)}</button>`;
}

function renderPanelHeader(eyebrow, title, copy, aside = "") {
  return `<div class="dashboard-panel-head">
    <div class="dashboard-panel-copy">
      ${eyebrow ? `<div class="eyebrow">${esc(eyebrow)}</div>` : ""}
      <h3>${esc(title)}</h3>
      ${copy ? `<p class="clamp-1">${esc(copy)}</p>` : ""}
    </div>
    ${aside || ""}
  </div>`;
}

function renderPageToolbar(eyebrow, title, copy = "", actions = "") {
  return `<div class="page-toolbar">
    <div class="page-toolbar-copy">
      ${eyebrow ? `<div class="eyebrow">${esc(eyebrow)}</div>` : ""}
      <h2>${esc(title)}</h2>
      ${copy ? `<p class="clamp-2">${esc(copy)}</p>` : ""}
    </div>
    ${actions ? `<div class="page-toolbar-actions">${actions}</div>` : ""}

}

function renderMetricCard(label, value, helper, tone = "info") {

}

function renderDiagnosticRow(label, pill, helper = "") {

function renderTelemetryCard(label, value, helper = "") {

  </div>`;
}

function componentTone(state) {
  if (["error", "unavailable"].includes(state)) return "offline";
  if (["starting", "connecting", "stopping", "pending", "retrying"].includes(state)) return "warn";
  if (["connected", "listening", "receiving", "running", "ready"].includes(state)) return "online";
  if (["idle", "disabled", "stopped"].includes(state)) return "info";
  return "info";
}

function componentStatePill(component, fallback = "unknown") {
  const state = component?.state || fallback;
  return pillByTone(componentTone(state), translateComponentState(state));
}

function severityTone(level) {
  if (level === "error") return "offline";
  if (level === "warn") return "warn";
  if (level === "success" || level === "ok") return "online";
  return "info";
}

function formatUptime(seconds) {
  const total = Math.max(0, Number(seconds) || 0);
  if (!total) return "только что";
  if (total < 60) return `${total}с`;
  if (total < 3600) return `${Math.floor(total / 60)}м`;
  const hours = Math.floor(total / 3600);
  const minutes = Math.floor((total % 3600) / 60);
  return minutes ? `${hours}ч ${minutes}м` : `${hours}ч`;
}

function translateComponentState(state) {
  const value = String(state || "").toLowerCase();
  const labels = {
    unknown: "неизвестно",
    error: "ошибка",
    unavailable: "недоступно",
    starting: "запуск",
    booting: "загрузка",
    connecting: "подключение",
    stopping: "остановка",
    pending: "ожидание",
    retrying: "повтор",
    connected: "подключено",
    listening: "слушаем",
    receiving: "идёт приём",
    running: "работает",
    ready: "готово",
    idle: "в ожидании",
    disabled: "выключено",
    stopped: "остановлено",
    waiting: "ожидание",
  };
  return labels[value] || state;
}

function translateSeverityLabel(level) {
  const value = String(level || "").toLowerCase();
  const labels = {
    error: "ошибка",
    warn: "внимание",
    success: "норма",
    ok: "норма",
    info: "инфо",
  };
  return labels[value] || level;
}

function translateRoleLabel(role) {
  const value = String(role || "").toLowerCase();
  const labels = {
    member: "участник",
    host: "хост",
    owner: "владелец",
    admin: "администратор",
    moderator: "модератор",
    creator: "создатель",
    driver: "гонщик",
  };
  return labels[value] || role;
}

function translateSeasonStatus(status) {
  const value = String(status || "").toLowerCase();
  const labels = {
    active: "активен",
    draft: "черновик",
    archived: "архив",
    completed: "завершён",
    pending: "ожидание",
    closed: "закрыт",
    paused: "пауза",
    inactive: "неактивен",
  };
  return labels[value] || status;
}

function formatRelativeTime(value) {
  if (!value) return "--";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return String(value);
  const diff = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000));
  if (diff < 10) return "только что";
  if (diff < 60) return `${diff}с назад`;
  if (diff < 3600) return `${Math.floor(diff / 60)}м назад`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}ч назад`;
  return `${Math.floor(diff / 86400)}д назад`;
}

function getHostSeasonById(seasonId) {
  if (!seasonId) return null;
  return (state.hostSeasons || []).find(season => String(season.id) === String(seasonId)) || null;
}

function syncSelectedHostSeason() {
  if (!state.selectedSeason) return null;
  const selected = getHostSeasonById(state.selectedSeason);
  if (!selected) {
    state.selectedSeason = "";
    return null;
  }
  state.selectedSeason = String(selected.id);
  return selected;
}

function pickHostSeason(seasonId, rerender = true) {
  state.selectedMode = "lobby";

  if (!rerender || !state.page) return;
  if (state.page === "dashboard") {
    syncDashboardView(true);
    return;
  }

}

async function loadHostSeasons(rerender = false) {
  if (!state.user) {
    state.hostSeasons = [];
    state.hostSeasonsLoading = false;
    state.hostSeasonsError = "";
    state.hostSeasonsLoadedAt = 0;
    return [];
  }

  const previousSeasons = state.hostSeasons || [];
  state.hostSeasonsLoading = true;
  state.hostSeasonsError = "";
  if (rerender && state.page === "dashboard") {
    syncDashboardView(true);
  } else if (rerender && state.page === "lobbies") {
    render();
  }

  let succeeded = false;
  try {
    state.hostSeasons = await api("get_host_seasons");
    state.hostSeasonsLoadedAt = Date.now();
    succeeded = true;
  } catch (error) {
    state.hostSeasons = previousSeasons;
    state.hostSeasonsError = error.message || "Не удалось загрузить хост-сезоны.";
    state.hostSeasonsLoadedAt = 0;
  } finally {
    if (succeeded) syncSelectedHostSeason();
    state.hostSeasonsLoading = false;
    if (rerender && state.page === "dashboard") {
      syncDashboardView(true);
    } else if (rerender && state.page === "lobbies") {
      render();
    }
  }

  return state.hostSeasons;
}

function render() {
  const root = document.getElementById("app-root");
  switch (state.page) {
    case "dashboard":
      root.innerHTML = layout(renderDashboard());
      queueMicrotask(loadDashboard);
      break;
    case "lobbies":
      root.innerHTML = layout(renderLobbies());
      queueMicrotask(loadLobbies);
      break;
    case "lobby-detail":
      root.innerHTML = layout(`<div class="panel"><div class="spinner"></div></div>`);
      queueMicrotask(() => loadLobbyDetail(state.params.id));
      break;
    case "profile":
      root.innerHTML = layout(renderProfile());
      queueMicrotask(loadProfile);
      break;
    case "engineer":
      ensureEngineerSeed();
      root.innerHTML = layout(renderEngineer());
      break;
    case "settings":
      root.innerHTML = layout(renderSettings());
      queueMicrotask(loadSettingsPage);
      break;
    default:
      root.innerHTML = layout(renderLogin(), false);
      queueMicrotask(loadLoginState);
      break;
  }
}

function navigate(page, params = {}) {
  state.page = page;
  state.params = params;
  render();
}

async function loadConfig() {
  try {
    state.config = await api("get_config");
    state.selectedMode = state.config.agent_mode || "personal";
    state.selectedSeason = state.config.season_id || "";
    state.hostSeasonsLoading = state.selectedMode === "lobby";
    state.hostSeasonsError = "";
    state.widgetPositions = state.config.widget_positions ? normalizeWidgetPositions(state.config.widget_positions) : null;
  } catch {
    state.config = {
      server_url: "http://localhost:8000",
      frontend_url: "http://localhost:3000",
      ws_url: "ws://localhost:8000/ws/agent",
      udp_port: "20777",
      season_id: "1",
      overlay_enabled: false,
      overlay_opacity: 85,
      widgets: WIDGETS.map(() => true),
      widget_positions: null,
      data_dir: "",
    };
    state.hostSeasonsLoading = false;
    state.hostSeasonsError = "";
    state.widgetPositions = null;
  }
}

async function refreshRuntime() {
  try {
    const diagnostics = await api("get_diagnostics");
    const status = diagnostics.agent || await api("get_agent_status");
    const live = diagnostics.live || await api("get_live_session");
    const prevState = state.agentStatus?.state;
    state.diagnostics = diagnostics;
    state.agentStatus = status;
    state.live = live;
    if (prevState && status.state !== prevState) notifyStateChange(status.state);
  } catch {}
}

function notifyStateChange(nextState) {
  if (nextState === "error" && state.suppressErrorStateToastUntil > Date.now()) {
    return;
  }
  if (state.suppressNextStateToast === nextState) {
    state.suppressNextStateToast = null;
    return;
  }
  const notes = {
    booting: ["Запущена последовательность старта агента", "info"],
    waiting: ["Трасса определена", "info"],
    qualifying: ["Началась квалификация", "info"],
    race: ["Началась гонка", "success"],
    finished: ["Гонка завершена, результат загружается", "info"],
    uploaded: ["Результат загружен", "success"],
    stopping: ["Запущено завершение агента", "info"],
    error: ["Агент сообщил об ошибке", "error"],
  };
  const entry = notes[nextState];
  if (entry) toast(entry[0], entry[1]);
}

function startPolling() {
  stopPolling();
  if (!state.user) return;
  state.pollingId = setInterval(async () => {
    await refreshRuntime();
    if (state.page === "dashboard") {
      if (shouldRefreshHostSeasons()) {
        await loadHostSeasons(false);
      }
      rerenderDashboardInPlace();
    }
    if (state.page === "engineer") {
      syncEngineerView();
    }
  }, 2500);
}

function stopPolling() {
  if (state.pollingId) {
    clearInterval(state.pollingId);
    state.pollingId = null;
  }
}

async function init() {
  await loadConfig();
  await refreshRuntime();
  if (state.user) {
    navigate("dashboard");
    startPolling();
  } else {
    navigate("login");
  }
}

async function doLogin() {
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  const errorNode = document.getElementById("login-error");
  const button = document.getElementById("login-button");
  if (!email || !password) {
    errorNode.textContent = "Введите email и пароль.";
    return;
  }
  button.disabled = true;
  errorNode.textContent = "";
  try {
    const result = unwrap(await api("login", email, password), "Не удалось выполнить вход");
    state.user = result;
    await refreshRuntime();
    navigate("dashboard");
    startPolling();
    toast("Вход выполнен", "success");
  } catch (error) {
    errorNode.textContent = error.message || "Не удалось выполнить вход";
  } finally {
    button.disabled = false;
  }
}

async function doGoogleLogin() {
  try {
    const result = unwrap(await api("start_google_login"), "Не удалось запустить вход через Google");
    toast("Браузер открыт для входа через Google", "info");
    await pollGoogleLogin(result.poll_id);
  } catch (error) {
    toast(error.message || "Не удалось запустить вход через Google", "error");
  }
}

async function submitNewAgentToken() {
  // Called from the auth-rejected banner on the dashboard. After backend
  // hands out a fresh AGENT_SECRET_TOKEN (PR 1.4 rotation) the user pastes
  // it here. set_agent_token() persists it; uploader/telemetry/ws_client
  // pick it up on the next attempt without restarting the agent.
  const input = document.getElementById("agent-token-input");
  if (!input) return;
  const value = (input.value || "").trim();
  if (!value) {
    toast("Введите токен.", "warn");
    return;
  }
  try {
    unwrap(await api("set_agent_token", value), "Не удалось применить токен");
    input.value = "";
    toast("AGENT_SECRET_TOKEN применён", "success");
    await refreshRuntime();
  } catch (error) {
    toast(error.message || "Не удалось применить токен", "error");
  }
}

async function pollGoogleLogin(pollId) {
  for (let attempt = 0; attempt < 120; attempt += 1) {
    await new Promise(resolve => setTimeout(resolve, 2000));
    try {
      const user = await api("check_google_login", pollId);
      if (user && user.id) {
        state.user = user;
        await refreshRuntime();
        navigate("dashboard");
        startPolling();
        toast("Вход через Google выполнен", "success");
        return;
      }
    } catch {}
  }
  toast("Истекло время ожидания входа через Google", "error");
}

async function saveLoginConnection() {
  const url = document.getElementById("login-server-url").value.trim();
  try {
    const saved = unwrap(await api("save_config", { server_url: url, sync_urls: true }), "Не удалось сохранить конфигурацию");
    state.config = saved.config;
    toast("Адрес подключения обновлён", "success");
    render();
  } catch (error) {
    document.getElementById("login-error").textContent = error.message || "Не удалось сохранить адрес";
  }
}

async function toggleAgent() {
  const stopping = Boolean(state.agentStatus?.running);
  try {
    if (stopping) {
      unwrap(await api("stop_agent"), "Не удалось остановить агента");
      toast("Запущено завершение агента", "info");
    } else {
      if (state.selectedMode === "lobby" && !getHostSeasonById(state.selectedSeason)) {
        throw new Error("Перед запуском режима хоста выбери корректный сезон лобби.");
      }
      unwrap(await api("start_agent", state.selectedMode, state.selectedSeason), "Не удалось запустить агента");
      toast("Запущена последовательность старта агента", "info");
    }
    await refreshRuntime();
    render();
  } catch (error) {
    if (!stopping) {
      state.suppressNextStateToast = "error";
      state.suppressErrorStateToastUntil = Date.now() + 5000;
    }
    await refreshRuntime();
    render();
    toast(error.message || "Команда для агента завершилась ошибкой", "error");
  }
}

async function loadLobbies() {
  const previousLobbies = state.lobbies || [];
  state.lobbiesError = "";
  try {
    const [lobbies] = await Promise.all([
      api("get_lobbies"),
      loadHostSeasons(false),
    ]);
    state.lobbies = lobbies;
  } catch (error) {
    state.lobbies = previousLobbies;
    state.lobbiesError = error.message || "Сейчас не удалось загрузить данные лобби.";
  }
  if (state.page === "lobbies") document.getElementById("app-root").innerHTML = layout(renderLobbies());
}

async function doCreateLobby() {
  const name = document.getElementById("create-lobby-name").value.trim();
  const description = document.getElementById("create-lobby-description").value.trim();
  if (!name) {
    document.getElementById("create-lobby-error").textContent = "Введите название лобби.";
    return;
  }
  try {
    const created = unwrap(await api("create_lobby", name, description), "Не удалось создать лобби");
    setModal("");
    toast("Лобби создано", "success");
    await loadLobbies();
    navigate("lobby-detail", { id: created.id });
  } catch (error) {
    document.getElementById("create-lobby-error").textContent = error.message || "Не удалось создать лобби";
  }
}

function useSeasonForHost(seasonId) {
  pickHostSeason(String(seasonId), false);
  toast("Хост-сезон выбран", "success");
  navigate("dashboard");
}

async function resetLobbyInvite(lobbyId) {
  try {
    unwrap(await api("reset_lobby_invite", lobbyId), "Не удалось обновить инвайт");
    toast("Инвайт-код обновлён", "success");
    await loadLobbyDetail(lobbyId);
  } catch (error) {
    toast(error.message || "Не удалось обновить инвайт", "error");
  }
}

async function createSeason(lobbyId) {
  const name = document.getElementById("new-season-name").value.trim();
  if (!name) {
    toast("Введите название сезона", "error");
    return;
  }
  try {
    const created = unwrap(await api("create_season", lobbyId, name), "Не удалось создать сезон");
    await loadHostSeasons(false);
    pickHostSeason(String(created.id), false);
    toast("Сезон создан и выбран для режима хоста", "success");
    await loadLobbyDetail(lobbyId);
  } catch (error) {
    toast(error.message || "Не удалось создать сезон", "error");
  }
}

async function loadProfile() {

  try {
    state.profile = await api("get_profile");

  if (state.engineerMessages.length) return;
  const liveReady = Boolean(state.live?.active);
  state.engineerMessages = [{
    role: "assistant",
    context: liveReady ? "Живая телеметрия подключена" : "Режим общей помощи",
    text: liveReady

  }];
}

    toolbar: JSON.stringify({ active: Boolean(live?.active) }),

    contextGrid: JSON.stringify({
      active: Boolean(live?.active),
      track: live?.track_name || status?.track_name || "",
      position: live?.position ?? "",

function patchEngineerSlot(node, html, signature) {
  if (!node || node.dataset.signature === signature) return;
  node.innerHTML = html;
  node.dataset.signature = signature;
}

function syncEngineerView({ syncMessages = false } = {}) {
  if (state.page !== "engineer") return;
  const page = document.querySelector(".page-engineer");
  if (!page) return;

  const live = state.live || {};
  const status = state.agentStatus || {};
  const signatures = getEngineerViewSignatures(live, status);

  patchEngineerSlot(page.querySelector('[data-engineer-slot="toolbar"]'), renderEngineerToolbar(live), signatures.toolbar);
  patchEngineerSlot(page.querySelector('[data-engineer-slot="dialog-head"]'), renderEngineerDialogHeader(live), signatures.dialogHeader);
  patchEngineerSlot(page.querySelector('[data-engineer-slot="context-head"]'), renderEngineerContextHeader(live), signatures.contextHeader);
  patchEngineerSlot(page.querySelector("#engineer-context-grid"), renderEngineerContextCards(live, status), signatures.contextGrid);

  if (syncMessages) {
    const log = page.querySelector("#engineer-log");
    if (log && log.dataset.signature !== signatures.messages) {
      const stickToBottom = (log.scrollHeight - log.scrollTop - log.clientHeight) < 28;
      log.innerHTML = renderEngineerMessages();
      log.dataset.signature = signatures.messages;
      if (stickToBottom) {
        log.scrollTop = log.scrollHeight;
      }
    }
  }
}

function renderEngineerLegacy() {

  const status = state.agentStatus || {};

  return `<div class="page app-page page-engineer">
    ${renderPageToolbar("ИИ-инженер", "Радиорубка", "Короткие ответы по болиду и сессии без выхода из launcher.", statusPill(Boolean(live?.active), live?.active ? "Есть живая телеметрия" : "Общий режим", !live?.active))}
    <div class="assistant-shell">
      <section class="panel section-card assistant-panel">
        ${renderPanelHeader("Диалог", "Текущий разговор", "Короткие вопросы, быстрые ответы и привязка к текущей сессии.", live?.active ? pillByTone("online", "live context") : pillByTone("info", "без live"))}
        <div class="assistant-log">
          ${state.engineerMessages.map(message => `
            <div class="bubble-row ${message.role === "user" ? "user" : ""}">
              <div class="avatar assistant-avatar">${message.role === "user" ? initials(state.user?.name || "Y") : "RE"}</div>

        </div>
        <div class="assistant-compose">

          <button class="btn btn-primary" onclick="askEngineer()">Отправить</button>
        </div>
      </section>
      <div class="page-stack">
        <section class="panel section-card">
          ${renderPanelHeader("Контекст", "Снимок сессии", "То, что инженер видит прямо сейчас.", live?.active ? pillByTone("online", "активно") : pillByTone("warn", "ожидание"))}
          <div class="assistant-context-grid">
            <div class="context-card">
              <span>Сессия</span>
              <strong>${esc(live.track_name || status.track_name || "Нет live")}</strong>
              <p>${esc(live.active ? `${live.position ? `P${live.position}` : "позиция не пришла"} · круг ${live.lap || "--"}` : "Агент ждёт поток UDP из F1 25.")}</p>
            </div>
            <div class="context-card">
              <span>Лучший круг</span>
              <strong>${esc(live.best_lap || "--")}</strong>
              <p>${esc(live.active ? "Лучшее время из текущей сессии." : "Появится после старта сессии.")}</p>
            </div>
            <div class="context-card">
              <span>Состояние агента</span>
              <strong>${esc(status.status || "Ожидание")}</strong>
              <p>${esc(status.label || "Статус агента ещё не получен.")}</p>
            </div>
            <div class="context-card">
              <span>Погода / шины</span>
              <strong>${esc(live.weather || live.tyre || "--")}</strong>
              <p>${esc(live.active ? `Шины: ${live.tyre || "--"} · износ ${live.tyre_wear_avg ?? "--"}%` : "Снимок шин и погоды появится вместе с телеметрией.")}</p>
            </div>
          </div>
        </section>
        <section class="panel section-card">
          ${renderPanelHeader("Запросы", "Быстрые вопросы", "Готовые формулировки для рабочего дня гонки.")}
          <div class="quick-prompt-list">${QUICK_PROMPTS.map(prompt => `<button class="chip" onclick="askEngineer('${esc(prompt)}')">${esc(prompt)}</button>`).join("")}</div>

}

function renderEngineer() {
  const live = state.live || {};
  const status = state.agentStatus || {};
  const signatures = getEngineerViewSignatures(live, status);
  return `<div class="page app-page page-engineer">
    <div data-engineer-slot="toolbar" data-signature="${escAttr(signatures.toolbar)}">${renderEngineerToolbar(live)}</div>
    <div class="assistant-shell">
      <section class="panel section-card assistant-panel">
        <div data-engineer-slot="dialog-head" data-signature="${escAttr(signatures.dialogHeader)}">${renderEngineerDialogHeader(live)}</div>
        <div class="assistant-log" id="engineer-log" data-signature="${escAttr(signatures.messages)}">
          ${renderEngineerMessages()}
        </div>
        <div class="assistant-compose">
          <input id="engineer-input" placeholder="Спроси про темп, торможение, шины, ERS или стратегию..." onkeydown="if(event.key==='Enter'){askEngineer()}">
          <button class="btn btn-primary" onclick="askEngineer()">Отправить</button>
        </div>
      </section>
      <div class="page-stack">
        <section class="panel section-card">
          <div data-engineer-slot="context-head" data-signature="${escAttr(signatures.contextHeader)}">${renderEngineerContextHeader(live)}</div>
          <div class="assistant-context-grid" id="engineer-context-grid" data-signature="${escAttr(signatures.contextGrid)}">
            ${renderEngineerContextCards(live, status)}
          </div>
        </section>
        <section class="panel section-card">
          ${renderPanelHeader("Запросы", "Быстрые вопросы", "Готовые формулировки для рабочего дня гонки.")}
          <div class="quick-prompt-list">${QUICK_PROMPTS.map(prompt => `<button class="chip" onclick="askEngineer('${esc(prompt)}')">${esc(prompt)}</button>`).join("")}</div>
        </section>
      </div>
    </div>
  </div>`;
}

function formatEngineerText(text) {
  return esc(text).replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>").replace(/`(.*?)`/g, "<span class='mono'>$1</span>").replace(/\n/g, "<br>");
}

async function askEngineer(prefill) {
  const input = document.getElementById("engineer-input");
  const question = prefill || input.value.trim();
  if (!question) return;
  if (input) input.value = "";
  state.engineerMessages.push({ role: "user", text: question, context: "" });
  if (state.page === "engineer") {
    syncEngineerView({ syncMessages: true });
  } else {
    render();
  }
  try {
    const response = await api("ask_engineer", question);
    state.engineerMessages.push({ role: "assistant", text: response.answer || "Инженер не вернул ответ.", context: response.context || "" });
  } catch (error) {
    state.engineerMessages.push({ role: "assistant", text: `Запрос к инженеру завершился ошибкой: ${error.message || error}`, context: "Проблема подключения лаунчера" });
  }
  if (state.page === "engineer") {
    syncEngineerView({ syncMessages: true });
  }
}

function renderSettings() {
  const cfg = state.config || {};
  const widgets = normalizeWidgetFlags(cfg.widgets);
  const positions = normalizeWidgetPositions(state.widgetPositions || cfg.widget_positions);
  const opacity = Number(cfg.overlay_opacity || 85);
  return `<div class="page app-page page-settings">
    ${renderPageToolbar("Настройки", "Подключения и оверлей", "Собери рабочую схему стека и настрой лабораторию HUD без лишних экранов.", `
      ${renderButton({ label: "Диагностика", variant: "secondary", onclick: "runDiagnostics()" })}
      ${renderButton({ label: "Сохранить", variant: "primary", onclick: "saveSettings()" })}
    `)}
    <div class="settings-shell">
      <section class="panel section-card settings-connection-card">
        ${renderPanelHeader("Подключения", "Схема стека", "Backend как источник истины, ручные overrides только там, где нужны.", renderButton({ label: "Вывести URL", variant: "ghost", onclick: "syncUrls()" }))}
        <div class="grid-2">
          <div class="field"><label>URL backend</label><input id="cfg-server-url" value="${esc(cfg.server_url || "")}"></div>
          <div class="field"><label>UDP-порт</label><input id="cfg-udp-port" value="${esc(cfg.udp_port || "20777")}"></div>
          <div class="field"><label>URL frontend</label><input id="cfg-frontend-url" value="${esc(cfg.frontend_url || "")}"></div>
          <div class="field"><label>URL WebSocket</label><input id="cfg-ws-url" value="${esc(cfg.ws_url || "")}"></div>
        </div>
      </section>
      <section class="panel section-card settings-utility-card">
        ${renderPanelHeader("Инструменты", "Рабочее пространство", "Быстрые действия со стороны launcher.", pillByTone("info", "оператор"))}
        <div class="settings-utility-grid">
          ${renderButton({ label: "Папка данных", variant: "ghost", onclick: "openDataFolder()", className: "btn-wide" })}
          ${renderButton({ label: "Веб-приложение", variant: "ghost", onclick: "openSite()", className: "btn-wide" })}
          ${renderButton({ label: "Оверлей", variant: "ghost", onclick: "openOverlay()", className: "btn-wide" })}
        </div>
        <p class="summary-note">Изменения подключений применятся при следующем запуске агента. Изменения оверлея сохраняются сразу.</p>
      </section>
    </div>
    <section class="panel section-card settings-overlay-card">
      ${renderPanelHeader("Оверлей", "Лаборатория HUD", "Предпросмотр модулей, ручной макет и запуск browser overlay.", cfg.overlay_enabled ? pillByTone("online", "автозапуск") : pillByTone("info", "ручной запуск"))}
      <div class="hud-preview" id="hud-preview" style="--preview-opacity:${Math.max(0.2, Math.min(1, opacity / 100))}">
        <div class="hud-preview-stage">
          ${WIDGETS.map((widget, index) => renderHudPreviewWidget(widget, index, widgets[index], positions[index])).join("")}
        </div>
        <div class="hud-preview-note">
          <span>Двойной клик включает и выключает модуль</span>
          <span>Browser overlay использует текущее состояние лаборатории</span>
        </div>
      </div>
      <div class="settings-overlay-controls">
        <div class="field">
          <label>Автозапуск оверлея</label>
          <select id="cfg-overlay-enabled">
            <option value="1" ${cfg.overlay_enabled ? "selected" : ""}>Запускать оверлей вместе с агентом</option>
            <option value="0" ${cfg.overlay_enabled ? "" : "selected"}>Оставить оверлей ручным</option>
          </select>
        </div>
        <div class="field">
          <label>Прозрачность оверлея</label>
          <input id="cfg-opacity" type="range" min="20" max="100" value="${opacity}" oninput="setPreviewOpacity(this.value)">
        </div>
        <div class="pill" id="cfg-opacity-value">${opacity}%</div>
        <button class="btn btn-secondary" onclick="openOverlay()">Открыть оверлей</button>
        <button class="btn btn-secondary" onclick="resetWidgetPositions()">Сбросить макет</button>
      </div>
      <p class="summary-note">Перетаскивай виджеты, двойным кликом отключай модули и открывай browser overlay без предварительного сохранения.</p>
    </section>
  </div>`;
}

function setPreviewOpacity(value) {
  const pct = Math.max(20, Math.min(100, Number(value) || 85));
  const badge = document.getElementById("cfg-opacity-value");
  if (badge) badge.textContent = `${pct}%`;
  const preview = document.getElementById("hud-preview");
  if (preview) preview.style.setProperty("--preview-opacity", String(pct / 100));
}

async function loadSettingsPage() {
  await loadConfig();
  if (state.page === "settings") document.getElementById("app-root").innerHTML = layout(renderSettings());
}

async function saveSettings() {
  const draft = collectOverlayDraft();
  if (!/^\d+$/.test(draft.udp_port) || Number(draft.udp_port) < 1 || Number(draft.udp_port) > 65535) {
    toast("UDP-порт должен быть числом от 1 до 65535.", "error");
    return;
  }
  try {
    const saved = unwrap(await api("save_config", draft), "Не удалось сохранить настройки");
    state.config = saved.config;
    state.widgetPositions = saved.config.widget_positions ? normalizeWidgetPositions(saved.config.widget_positions) : null;
    toast("Настройки сохранены", "success");
    render();
  } catch (error) {
    toast(error.message || "Не удалось сохранить настройки", "error");
  }
}

async function syncUrls() {
  try {
    const derived = await api("derive_connection_urls", document.getElementById("cfg-server-url").value.trim());
    document.getElementById("cfg-server-url").value = derived.server_url;
    document.getElementById("cfg-frontend-url").value = derived.frontend_url;
    document.getElementById("cfg-ws-url").value = derived.ws_url;
    toast("URL подключений выведены из backend", "success");
  } catch (error) {
    toast(error.message || "Не удалось вывести URL", "error");
  }
}

let dragState = null;
function syncWidgetNodeState(el) {
  if (!el) return;
  const active = el.classList.contains("active");
  el.classList.toggle("inactive", !active);
  const badge = el.querySelector(".hud-state");
  if (badge) badge.textContent = active ? "Вкл" : "Выкл";
}
function toggleWidget(index) {
  const el = document.querySelector(`.hud-widget[data-index="${index}"]`);
  if (!el) return;
  el.classList.toggle("active");
  syncWidgetNodeState(el);
}
function startDragWidget(event, index) {
  const el = document.querySelector(`.hud-widget[data-index="${index}"]`);
  const preview = document.getElementById("hud-preview");
  if (!el || !preview || event.button !== 0 || event.detail > 1) return;
  const rect = preview.getBoundingClientRect();
  const box = el.getBoundingClientRect();
  dragState = { index, el, rect, offsetX: event.clientX - box.left, offsetY: event.clientY - box.top };
  el.classList.add("dragging");
  document.addEventListener("mousemove", onDragWidget);
  document.addEventListener("mouseup", stopDragWidget);
}
function onDragWidget(event) {
  if (!dragState) return;
  const { el, rect } = dragState;
  const x = ((event.clientX - dragState.offsetX - rect.left) / rect.width) * 100;
  const y = ((event.clientY - dragState.offsetY - rect.top) / rect.height) * 100;
  const clampedX = Math.max(0, Math.min(100 - parseFloat(el.style.width), x));
  const clampedY = Math.max(0, Math.min(100 - parseFloat(el.style.height), y));
  el.style.left = `${clampedX}%`;
  el.style.top = `${clampedY}%`;
}
function stopDragWidget() {
  if (!dragState) return;
  dragState.el.classList.remove("dragging");
  state.widgetPositions = state.widgetPositions || defaultWidgetPositions();
  state.widgetPositions[dragState.index] = { x: Math.round(parseFloat(dragState.el.style.left) * 10) / 10, y: Math.round(parseFloat(dragState.el.style.top) * 10) / 10 };
  document.removeEventListener("mousemove", onDragWidget);
  document.removeEventListener("mouseup", stopDragWidget);
  dragState = null;
}
function resetWidgetPositions() {
  state.widgetPositions = defaultWidgetPositions();
  document.querySelectorAll(".hud-widget").forEach((node, index) => {
    node.style.left = `${state.widgetPositions[index].x}%`;
    node.style.top = `${state.widgetPositions[index].y}%`;
  });
}

async function openOverlay() {
  try {
    const draft = document.getElementById("hud-preview") ? collectOverlayDraft() : null;
    unwrap(await api("open_overlay", draft), "Не удалось открыть оверлей");
    toast("Оверлей открыт в браузере", "info");
  } catch (error) {
    toast(error.message || "Не удалось открыть оверлей", "error");
  }
}

async function openDataFolder() {
  try {
    unwrap(await api("open_data_folder"), "Не удалось открыть папку данных");
    toast("Папка данных открыта", "info");
  } catch (error) {
    toast(error.message || "Не удалось открыть папку данных", "error");
  }
}

async function openSite(path = "") {
  try {
    unwrap(await api("open_website", path), "Не удалось открыть веб-приложение");
    toast("Веб-приложение открыто", "info");
  } catch (error) {
    toast(error.message || "Не удалось открыть веб-приложение", "error");
  }
}

async function logoutUser() {
  try { await api("logout"); } catch {}
  state.user = null;
  state.profile = null;
  state.profileError = "";
  state.lobbiesError = "";
  state.engineerMessages = [];
  stopPolling();
  navigate("login");
}

async function copyText(text) {
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(text);
    } else {
      const input = document.createElement("textarea");
      input.value = text;
      document.body.appendChild(input);
      input.select();
      document.execCommand("copy");
      input.remove();
    }
    toast("Скопировано", "success");
  } catch {
    toast("Не удалось скопировать", "error");
  }
}
